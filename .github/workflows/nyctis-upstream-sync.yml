# Keep this fork current with chainapsis/vizor-wallet (see FORK.md).
#
# - `main` is fast-forwarded to upstream `main` (it is a mirror and never carries our commits).
# - If upstream moved past the Nyctis branch, a branch `sync/upstream-<short sha>` is created with
#   upstream merged in and a pull request is opened against the Nyctis branch. A conflicting merge
#   opens an issue listing the files instead; `scripts/nyctis-sync-upstream.sh` resolves the
#   common case (only the generated bridge files conflict) locally.
#
# Scheduled workflows run from the repository's default branch, so this file takes effect once
# the Nyctis branch is the default (or it can be run by hand from the Actions tab).
#
# Token: pushing upstream commits that touch `.github/workflows/**` needs a token with the
# `workflow` scope, which GITHUB_TOKEN lacks. Add a fine-grained token as the secret SYNC_TOKEN
# (contents, pull requests, issues and workflows: read/write on this repository); without it the
# job falls back to GITHUB_TOKEN and works until upstream changes a workflow file.
name: Nyctis upstream sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nyctis-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/chainapsis/vizor-wallet.git
  NYCTIS_BRANCH: nyctis-poc

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --quiet upstream main
          git fetch --quiet origin

      - name: Fast-forward main
        run: |
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse upstream/main)" ]; then
            echo "main is already upstream main"
          elif git merge-base --is-ancestor origin/main upstream/main; then
            git push origin upstream/main:refs/heads/main
          else
            echo "::error::origin/main has commits upstream does not; main must stay a mirror"
            exit 1
          fi

      - name: Merge upstream into the Nyctis branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          git config user.name "nyctis-sync"
          git config user.email "nyctis-sync@users.noreply.github.com"
          behind=$(git rev-list --count "origin/$NYCTIS_BRANCH..upstream/main")
          if [ "$behind" = 0 ]; then
            echo "The Nyctis branch already contains upstream main."
            exit 0
          fi
          short=$(git rev-parse --short upstream/main)
          sync="sync/upstream-$short"
          if git ls-remote --exit-code --heads origin "$sync" >/dev/null; then
            echo "$sync already exists; a pull request for it is open or was handled."
            exit 0
          fi
          git checkout -q -b "$sync" "origin/$NYCTIS_BRANCH"
          if git merge --no-ff --no-edit upstream/main -m "Merge upstream main ($short) into $NYCTIS_BRANCH"; then
            git push -q origin "$sync"
            gh pr create --base "$NYCTIS_BRANCH" --head "$sync" \
              --title "Merge upstream main ($short) into $NYCTIS_BRANCH" \
              --body "Upstream \`chainapsis/vizor-wallet\` moved $behind commit(s) past \`$NYCTIS_BRANCH\`. This merges it cleanly. Before merging: run \`cd rust && cargo test --lib\` and \`fvm flutter test\` locally (the bridge is regenerated by \`scripts/generate-rust-bridge.sh\` if the Rust API changed)."
          else
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            gh issue create --title "Upstream sync needs a hand ($short)" \
              --body "Merging upstream \`main\` ($short, $behind commit(s)) into \`$NYCTIS_BRANCH\` conflicts in:

          $files

          If only \`lib/src/rust/frb_generated.dart\` and \`rust/src/frb_generated.rs\` are listed, run \`scripts/nyctis-sync-upstream.sh\` locally: it regenerates them. Otherwise resolve the merge by hand."
          fi
